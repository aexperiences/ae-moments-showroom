<script>
(function(){
  var S = window.Moments;
  var content = S.mount({ active:"approvals.html", crumb:"Approval desk" });

  content.appendChild(S.page("Approval desk","Anything that sends to a client, spends money or changes a price waits here for you."));
  content.appendChild(S.card('<h2>Nothing waiting</h2><p class="sub">When the system wants to send a gallery, chase a balance, or release a licence, it stops here first and puts your name on the decision.</p>'));
  content.appendChild(S.card('<h2>What always stops here</h2><ul>'+
    ["Sending a gallery or a contract to a client","Chasing an outstanding balance","Changing a package price",
     "Releasing images under a new licence","Deleting or retiring a gallery","Anything that would spend money"]
    .map(function(x){ return '<li>'+x+'</li>'; }).join("")+'</ul>'));

})();
</script>
