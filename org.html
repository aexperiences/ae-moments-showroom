<body>
<script src="moments.js"></script>
<script src="manual.js"></script>
<script>
(function(){
  var S = window.Moments;
  var content = S.mount({ active:"org.html", crumb:"Agent org · bus" });

  content.appendChild(S.page("Agent org","Four desks, one point of contact. You get a decision, not four opinions."));
  content.appendChild(S.card('<h2>'+S.esc(S.BRAIN.name)+'</h2><p class="sub"><b>'+S.esc(S.BRAIN.role)+'</b><br>'+S.esc(S.BRAIN.line)+'</p>'));
  content.appendChild(S.card('<h2>Desks</h2><div class="tablewrap"><table><thead><tr><th>Desk</th><th>Head</th><th>Covers</th></tr></thead><tbody>'+
    S.SEATS.map(function(s){ return '<tr><td><b>'+S.esc(s.dept)+'</b></td><td>'+S.esc(s.head)+'</td><td class="mut">'+s.aes.map(S.esc).join(" · ")+'</td></tr>'; }).join("")+
    '</tbody></table></div>'));
  content.appendChild(S.card('<h2>Native or vendor — named plainly</h2><div class="tablewrap"><table><thead><tr><th>Capability</th><th>How it works</th></tr></thead><tbody>'+
    S.SYSTEMS.map(function(s){ return '<tr><td>'+S.esc(s.what)+'</td><td>'+(s.native?S.tag("native","good"):S.tag("vendor","watch"))+' <span class="mut">'+S.esc(s.how)+'</span></td></tr>'; }).join("")+
    '</tbody></table></div><p class="sub">The e-sign layer is ours — we built it. It is not a reseller wrapper around somebody else\'s product, which is why it is not a separate subscription.</p>'));

})();
</script>
</body>
